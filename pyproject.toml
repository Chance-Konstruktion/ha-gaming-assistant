# Tooling configuration for the Gaming Assistant integration.
# Ruff is used for linting in CI (see .github/workflows/ci.yml).

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's default set: the default
# moves between ruff releases, which silently changes what CI enforces. These
# are the rules we want — pyflakes (undefined names, unused imports) plus the
# pycodestyle subset that catches real bugs — without the noise of opinionated
# style rules.
#   E4  imports        E7  statements        E9  runtime/IO errors
#   F   pyflakes       E402 module-level import not at top of file
select = ["E4", "E7", "E9", "F", "E402"]

[tool.ruff.lint.per-file-ignores]
# The test suite intentionally injects stub HA modules into sys.modules
# *before* importing the integration, so module-level imports are not at the
# top of the file. That is by design, not a defect.
"tests/**" = ["E402"]

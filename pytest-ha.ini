# pytest configuration for the tests that need a real Home Assistant (tests_ha/).
#
# Used by two CI jobs:
#   - GitLab `pytest-ha` (shared CI template): the CURRENT Home Assistant
#     release, installed from requirements_test_ha.txt. This is the merge gate.
#   - GitHub `smoketest` (.github/workflows/ci.yml): the MINIMUM supported
#     release (hacs.json), installed from requirements-smoketest.txt.
#
# The unit suite in tests/ stubs Home Assistant away and is configured in
# pyproject.toml; the two must never share a run.
[pytest]
testpaths = tests_ha
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider

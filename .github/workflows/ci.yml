name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests + syntax checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-test.txt is the single source of truth for the full set
        # of test deps. Installing all of them (incl. numpy) means the capture
        # bridge, OCR, audio, chess and agent-executor suites run for real —
        # nothing is silently skipped (enforced below via STRICT_NO_SKIP).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Python syntax check (all .py files)
        run: find . -name '*.py' -not -path './.git/*' -exec python -m py_compile {} +

      - name: Lint (ruff)
        run: ruff check custom_components/gaming_assistant tests tests_ha worker

      - name: Run tests + coverage
        # STRICT_NO_SKIP turns a skipped test into a build failure: with every
        # optional dep installed, a skip means a dependency went missing and a
        # module stopped being exercised. -rs prints any skip reason in the log.
        # pyproject.toml limits this run to tests/; the real-HA tests in
        # tests_ha/ have their own job below.
        env:
          STRICT_NO_SKIP: "1"
        run: |
          pytest -q -rs \
            --cov=custom_components/gaming_assistant \
            --cov-report=term-missing \
            --cov-fail-under=70

  smoketest:
    name: HA load smoketest (minimum supported HA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Home Assistant test stack
        # Heavyweight, isolated from the unit job: a real HA core plus the
        # runtime deps of the integration's manifest dependencies. Pinned to
        # the MINIMUM supported release (hacs.json); the GitLab job pytest-ha
        # runs the same tests against the current release.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-smoketest.txt

      - name: Boot a real Home Assistant and load the integration
        # Separate from the unit suite, which stubs HA away — this one needs the
        # genuine article. pytest-ha.ini points at tests_ha/ and sets
        # asyncio_mode=auto, so the unit job's config is untouched.
        env:
          STRICT_NO_SKIP: "1"
        run: pytest -c pytest-ha.ini -v -rs
